<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Drawing tool</title>
        <link rel="stylesheet" href="style.css" />
        <script defer src="script.js"></script>
    </head>
    <body>
        <div class="container">
            <section class="tools">
                <div class="row">
                    <label class="title"><strong>Tools</strong></label>
                    <ul class="options">

                        <li class="option active tool" id="pencil">
                            <svg class="icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                                <path d="M8.29289 3.70711L1 11V15H5L12.2929 7.70711L8.29289 3.70711Z"/>
                                <path d="M9.70711 2.29289L13.7071 6.29289L15.1716 4.82843C15.702 4.29799 16 3.57857 16 2.82843C16 1.26633 14.7337 0 13.1716 0C12.4214 0 11.702 0.297995 11.1716 0.828428L9.70711 2.29289Z"/>
                            </svg>
                            <span>Pencil</span>
                        </li>

                        <li class="option tool" id="brush">
                            <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M22.017 3.87391L21.4276796 5.45540216C20.9660775 6.52876151 20.7217843 7.09438745 20.6948 7.15228C20.0166 8.60718 19.0834952 10.3081 17.9675 11.4819C16.9021 12.6025 15.2942 13.6349 14.0064 14.3682C14.3373 15.9626 13.8841 17.6872 12.6467 18.9246C10.3763 21.195 7.84044 21.1954 5.95355 20.6345C4.52346 20.2093 3.34772 19.4373 2.22437 18.4868C2.02627 18.3191 2.03881 18.0117 2.25118 17.8625L2.75141656 17.5011368C3.4233036 16.99354 4.075846 16.37466 4.24147 15.5465C4.35588667 14.6208833 4.42143333 14.1163833 4.43811 14.033C4.57591 13.344 4.86751 12.5616 5.5756 11.8535C6.81296 10.6162 8.53748 10.1629 10.1318 10.4938C10.8651 9.20599 11.8976 7.59803 13.0182 6.53254C14.192 5.41656 15.8929 4.48346 17.3478 3.8053L19.0446264 3.07238289L20.6261 2.48301C21.4896 2.18807 22.312 3.01044 22.017 3.87391Z"/>
                            </svg>
                            <span>Brush</span>
                        </li>

                        <li class="option">Slider
                            <input type="range" id="sizeSlider" min="1" max="30" value="5" />
                        </li>

                        <li class="option tool" id="eraser">
                            <svg viewBox="0 0 24 24" class="icon">
                                <path d="M5.50506 11.4096L6.03539 11.9399L5.50506 11.4096ZM3 14.9522H2.25H3ZM9.04776 21V21.75V21ZM11.4096 5.50506L10.8792 4.97473L11.4096 5.50506ZM13.241 17.8444C13.5339 18.1373 14.0088 18.1373 14.3017 17.8444C14.5946 17.5515 14.5946 17.0766 14.3017 16.7837L13.241 17.8444ZM7.21629 9.69832C6.9234 9.40543 6.44852 9.40543 6.15563 9.69832C5.86274 9.99122 5.86274 10.4661 6.15563 10.759L7.21629 9.69832ZM17.9646 12.0601L12.0601 17.9646L13.1208 19.0253L19.0253 13.1208L17.9646 12.0601ZM6.03539 11.9399L11.9399 6.03539L10.8792 4.97473L4.97473 10.8792L6.03539 11.9399ZM6.03539 17.9646C5.18538 17.1146 4.60235 16.5293 4.22253 16.0315C3.85592 15.551 3.75 15.2411 3.75 14.9522H2.25C2.25 15.701 2.56159 16.3274 3.03 16.9414C3.48521 17.538 4.1547 18.2052 4.97473 19.0253L6.03539 17.9646ZM4.97473 10.8792C4.1547 11.6993 3.48521 12.3665 3.03 12.9631C2.56159 13.577 2.25 14.2035 2.25 14.9522H3.75C3.75 14.6633 3.85592 14.3535 4.22253 13.873C4.60235 13.3752 5.18538 12.7899 6.03539 11.9399L4.97473 10.8792ZM12.0601 17.9646C11.2101 18.8146 10.6248 19.3977 10.127 19.7775C9.64651 20.1441 9.33665 20.25 9.04776 20.25V21.75C9.79649 21.75 10.423 21.4384 11.0369 20.97C11.6335 20.5148 12.3008 19.8453 13.1208 19.0253L12.0601 17.9646ZM4.97473 19.0253C5.79476 19.8453 6.46201 20.5148 7.05863 20.97C7.67256 21.4384 8.29902 21.75 9.04776 21.75V20.25C8.75886 20.25 8.449 20.1441 7.9685 19.7775C7.47069 19.3977 6.88541 18.8146 6.03539 17.9646L4.97473 19.0253ZM17.9646 6.03539C18.8146 6.88541 19.3977 7.47069 19.7775 7.9685C20.1441 8.449 20.25 8.75886 20.25 9.04776H21.75C21.75 8.29902 21.4384 7.67256 20.97 7.05863C20.5148 6.46201 19.8453 5.79476 19.0253 4.97473L17.9646 6.03539ZM19.0253 13.1208C19.8453 12.3008 20.5148 11.6335 20.97 11.0369C21.4384 10.423 21.75 9.79649 21.75 9.04776H20.25C20.25 9.33665 20.1441 9.64651 19.7775 10.127C19.3977 10.6248 18.8146 11.2101 17.9646 12.0601L19.0253 13.1208ZM19.0253 4.97473C18.2052 4.1547 17.538 3.48521 16.9414 3.03C16.3274 2.56159 15.701 2.25 14.9522 2.25V3.75C15.2411 3.75 15.551 3.85592 16.0315 4.22253C16.5293 4.60235 17.1146 5.18538 17.9646 6.03539L19.0253 4.97473ZM11.9399 6.03539C12.7899 5.18538 13.3752 4.60235 13.873 4.22253C14.3535 3.85592 14.6633 3.75 14.9522 3.75V2.25C14.2035 2.25 13.577 2.56159 12.9631 3.03C12.3665 3.48521 11.6993 4.1547 10.8792 4.97473L11.9399 6.03539ZM14.3017 16.7837L7.21629 9.69832L6.15563 10.759L13.241 17.8444L14.3017 16.7837Z"
                                fill="currentColor"/>
                                <path d="M9 21H21"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"/>
                            </svg>
                            <span>Eraser</span>
                        </li>

                        <li class="option tool" id="undo">
                            <svg viewBox="0 0 24 24" class="icon">
                                <path d="M4 7H15C16.8 7 20 9 20 12C20 15 17 17 15 17H8"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"                                stroke-linejoin="round"/>
                                <path d="M4 7L7 4M4 7L7 10"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"                                stroke-linejoin="round"/>
                            </svg>
                            <span>Undo</span>
                        </li>

                        <li class="option tool" id="redo">
                            <svg viewBox="0 0 24 24" class="icon">
                                <path d="M20 7H9C7.2 7 4 9 4 12C4 15 7 17 9 17H16"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"/>
                                <path d="M20 7L17 4M20 7L17 10"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"/>
                            </svg>
                            <span>Redo</span>
                        </li>
                    </ul>
                </div>

                <hr size="1px">
                
                <div class="row shapes">
                    <p class="title" style = "margin-top: 15px;"><strong>Shapes</strong></p>

                    <label style="margin: 10px;">
                        <input type="checkbox" id="fillColor" />
                        Fill Color
                    </label>

                    <ul class="options">
                        <li class="option tool" id="line">
                            <svg viewBox="0 0 24 24" class="icon">
                                <line x1="4" y1="20" x2="20" y2="4"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"/>
                            </svg>
                            <span>Line</span>
                        </li>

                        <li class="option tool" id="square">
                            <svg viewBox="0 0 24 24" class="icon">
                                <rect x="4" y="4" width="16" height="16"
                                stroke="currentColor"
                                stroke-width="2"
                                fill="none"/>
                            </svg>
                            <span>Square</span>
                        </li>

                        <li class="option tool" id="rectangle">
                            <svg viewBox="0 0 24 24" class="icon">
                            <path d="M2 4h20v16H2z" fill="none" stroke="currentColor"   />
                            </svg>
                            <span>Rectangle</span>
                        </li>
                        <li class="option tool" id="circle">
                            <svg viewBox="0 0 24 24" class="icon">
                                <circle cx="12" cy="12" r="9"
                                stroke="currentColor"
                                stroke-width="2"
                                fill="none"/>
                            </svg>
                            <span>Circle</span>
                        </li>

                        <li class="option tool" id="triangle">
                            <svg viewBox="0 0 24 24" class="icon">
                                <path d="M12 4L21 20H3L12 4Z" fill="none" stroke="currentColor"/>
                            </svg>
                            <span>Triangle</span>
                        </li>

                        <li class="option tool" id="pentagon">
                            <svg viewBox="0 0 24 24" class="icon">
                                <polygon points="12,3 20,9 17,20 7,20 4,9"
                                stroke="currentColor"
                                stroke-width="2"
                                fill="none"/>
                            </svg>
                            <span>Pentagon</span>
                        </li>


                        <li class="option tool" id="hexagon">
                            <svg viewBox="0 0 24 24" class="icon">
                                <polygon points="12,4 19,8 19,16 12,20 5,16 5,8"
                                fill="none" stroke="currentColor"/>
                            </svg>
                            <span>Hexagon</span>
                        </li>

                        
                        <li class="option tool" id="diamond">
                            <svg viewBox="0 0 24 24" class="icon">
                                <polygon points="12,4 20,12 12,20 4,12"
                                stroke="currentColor"
                                stroke-width="2"
                                fill="none"/>
                            </svg>
                            <span>Diamond</span>
                        </li>

                    </ul>
                </div>

                <hr size="1px">

                <div class="row colors">
                    <label class="title" style="margin-top: 15px;"><strong>Colors</strong></label>
                    <ul class="options">
                        <input type="color" value="#00FF00" name="" id="colorPicker" />
                        </li>
                    </ul>
                </div>
            </section>

            <section class="drawingArea">
                <canvas></canvas>
            </section>

            <div class="button">
                <button class="tool" id="clearCanvas">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path d="M3 6H21M8 6V4H16V6M6 6L7 20H17L18 6"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>
                    </svg>
                    <span>Clear Canvas</span>
                </button>

                <button class="tool" id="saveImg">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path d="M12 16V4M12 16L7 11M12 16L17 11M5 20H19" 
                            stroke="currentColor" 
                             stroke-width="2" 
                            stroke-linecap="round" 
                            stroke-linejoin="round"/>
                    </svg>
                    <span>Save Image</span>
                </button>
            </div>
        </div>
    </body>
</html>
